<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <!-- 手机适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LXY Space</title>

    <!-- 主样式 -->
    <link rel="stylesheet" href="style.css">

    <!-- 图标库（后续可替换为本地） -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >
</head>


<body>

<!-- ======================
     顶部导航
====================== -->

<header class="top-bar">

    <div class="logo">
        LXY SPACE
    </div>


    <nav class="navigation">

        <button data-page="home">
            <i class="fa-solid fa-house"></i>
            首页
        </button>


        <button data-page="music">
            <i class="fa-solid fa-music"></i>
            音乐
        </button>


        <button data-page="games">
            <i class="fa-solid fa-gamepad"></i>
            游戏
        </button>


        <button data-page="diary">
            <i class="fa-solid fa-book"></i>
            记录
        </button>


        <button data-page="gallery">
            <i class="fa-solid fa-images"></i>
            展览
        </button>


        <button data-page="ai">
            <i class="fa-solid fa-robot"></i>
            AI
        </button>

    </nav>


    <!-- 深浅色切换 -->

    <button id="theme-toggle">

        <i class="fa-solid fa-moon"></i>

    </button>


</header>





<!-- ======================
     主内容区域
====================== -->

<main id="app">



<!-- ======================
     首页
====================== -->

<section 
    id="home-page"
    class="page active"
>


    <!-- 随机句子 -->

    <div class="card quote-card">


        <div class="card-title">

            <i class="fa-solid fa-feather"></i>

            今日句子

        </div>


        <div id="random-quote">


            <p id="quote-text">

                Loading...

            </p>


            <p id="quote-info">

            </p>


        </div>


        <div class="quote-buttons">


            <button id="new-quote">

                <i class="fa-solid fa-shuffle"></i>

                随机

            </button>


            <button id="favorite-quote">

                <i class="fa-regular fa-heart"></i>

                收藏

            </button>


        </div>


    </div>






    <!-- 快速入口 -->

    <div class="card shortcut-card">


        <div class="card-title">

            快速进入

        </div>


        <div class="shortcut-grid">


            <button>
                🎵
                <span>音乐</span>
            </button>


            <button>
                🎮
                <span>游戏</span>
            </button>


            <button>
                📖
                <span>日记</span>
            </button>


            <button>
                🖼
                <span>展览</span>
            </button>


            <button>
                🤖
                <span>AI</span>
            </button>


        </div>


    </div>



</section>







<!-- ======================
     音乐页面
====================== -->


<section
    id="music-page"
    class="page"
>


<div class="card">


    <div class="card-title">

        <i class="fa-solid fa-headphones"></i>

        音乐中心

    </div>



    <div id="music-library">


        <button id="select-music-folder">


            <i class="fa-solid fa-folder-open"></i>


            选择音乐文件夹


        </button>



        <div id="music-list">

            暂无音乐


        </div>


    </div>


</div>


</section>







<!-- ======================
     游戏页面
====================== -->


<section
    id="games-page"
    class="page"
>


<div class="card">


<div class="card-title">

<i class="fa-solid fa-gamepad"></i>

游戏空间

</div>



<div class="game-grid">


<button id="game-2048">

2048

</button>


<button id="game-pet">

宠物养成

</button>


<button id="game-doodle">

涂鸦

</button>


<button id="game-run">

跑酷

</button>



</div>



<div id="game-container">


</div>



</div>



</section>









<!-- ======================
     日记记录页面
====================== -->


<section
    id="diary-page"
    class="page"
>


<div class="card">


<div class="card-title">


<i class="fa-solid fa-pen"></i>


记录空间


</div>



<textarea
id="diary-input"
placeholder="写点什么..."
></textarea>



<button id="save-diary">

保存

</button>



<div id="todo-area">

<!-- 待办系统 -->


</div>



<div id="countdown-area">

<!-- 倒计时 -->


</div>



</div>


</section>









<!-- ======================
     展览馆
====================== -->


<section
id="gallery-page"
class="page"
>


<div class="card">


<div class="card-title">


<i class="fa-solid fa-photo-film"></i>


私人展览馆


</div>



<button id="add-gallery-item">


添加作品

</button>



<div id="gallery-container">


</div>



</div>


</section>









<!-- ======================
     AI页面
====================== -->


<section
id="ai-page"
class="page"
>


<div class="card">


<div class="card-title">


<i class="fa-solid fa-robot"></i>


AI Assistant


</div>



<div id="ai-setting">


<textarea
id="system-prompt"
placeholder="输入你的全局提示词..."
></textarea>


<input
id="api-key"
placeholder="OpenAI API Key"
/>


<input
id="model-name"
placeholder="模型名称"
/>


</div>





<div id="chat-box">


</div>



<div class="chat-input">


<input
id="user-message"
placeholder="输入消息"
/>



<button id="send-message">

发送

</button>



</div>



</div>


</section>







</main>









<!-- ======================
     底部音乐播放器
====================== -->


<footer class="player-bar">



<div class="player-info">


<img 
id="album-cover"
src=""
alt="cover"
>


<div>


<div id="song-title">

No Music

</div>


<div id="song-artist">

Unknown

</div>


</div>



</div>






<div class="player-controls">


<button id="previous-song">

<i class="fa-solid fa-backward"></i>

</button>


<button id="play-button">

<i class="fa-solid fa-play"></i>

</button>


<button id="next-song">

<i class="fa-solid fa-forward"></i>

</button>


</div>





<div class="progress-area">


<input
type="range"
id="progress"
min="0"
max="100"
value="0"
/>



</div>





</footer>








<!-- ======================
     JS入口
====================== -->


<script type="module" src="app.js"></script>



</body>

  </html>

</footer>

</div><script src="app.js"></script></body></html>
