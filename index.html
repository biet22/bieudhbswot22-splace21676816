<body>


<!-- =====================
顶部导航
===================== -->


<header class="top-bar">


<h1>
✦ My Space
</h1>



<nav>


<button data-page="home">

</button>

<button id="theme-toggle">

<i class="fa-solid fa-moon"></i>

</button>



</nav>

<!-- =====================
主页
===================== -->


<section
class="page active"
id="home-page">



<div class="hero">


<h2>
Welcome
</h2>


<p>
你的私人数字空间
</p>


</div>





<div class="quote-box">


<h3>
随机句子
</h3>



<div id="quote-text">

加载中...

</div>



<div id="quote-info">

</div>




<div class="quote-buttons">


<button id="new-quote">

随机

</button>



<button id="favorite-quote">

收藏

</button>


</div>



</div>








<div class="shortcut-grid">


<button data-goto="music">

🎵 音乐

</button>


<button data-goto="games">

</button>


<button data-goto="diary">

📓 记录

</button>


<button data-goto="gallery">

🖼 展览

</button>


<button data-goto="ai">

</button>



</div>



</section>









<!-- =====================
音乐页面
===================== -->


<section
class="page"
id="music-page">



<div class="music-layout">





<div class="album-area">


<img
id="album-cover"
src=""
alt="cover">



<h2 id="song-title">

No Music

</h2>



<p id="song-artist">

Unknown

</p>


</div>







<div class="player-control">


<button id="select-music-folder">

选择音乐文件夹

</button>



<div class="buttons">


<button id="previous-song">

<i class="fa-solid fa-backward"></i>

</button>


<button id="play-button">

<i class="fa-solid fa-play"></i>

</button>


<button id="next-song">

<i class="fa-solid fa-forward"></i>

</button>


</div>





<input
id="progress"
type="range"
min="0"
max="100"
value="0">



</div>









<div id="music-list">


</div>







<!-- 歌词区域 -->

<div class="lyrics-box">


<h3>
Lyrics
</h3>



<div id="lyrics-container">

</div>



</div>







<!-- 均衡器 -->

<div class="equalizer-box">


<h3>
Equalizer
</h3>



<div class="eq-sliders">



<input
type="range"
class="eq-band"
min="-12"
max="12"
value="0">



<input
type="range"
class="eq-band"
min="-12"
max="12"
value="0">



<input
type="range"
class="eq-band"
min="-12"
max="12"
value="0">



<input
type="range"
class="eq-band"
min="-12"
max="12"
value="0">



<input
type="range"
class="eq-band"
min="-12"
max="12"
value="0">



<input
type="range"
class="eq-band"
min="-12"
max="12"
value="0">

</div>




</div>
